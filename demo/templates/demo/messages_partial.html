{% for chat_msg in chat_messages %}
    <div class="message-bubble">
        <div class="message-header">
            <span class="message-sender">
                {% if chat_msg.sender %}
                    👤 {{ chat_msg.sender.username }}
                {% else %}
                    <span style="color: #5865F2;">{{ chat_msg.external_sender }}</span>
                {% endif %}
            </span>

            {% if user.is_staff %}
            <form action="{% url 'delete_message' chat_msg.pk %}" method="POST" class="delete-form">
                {% csrf_token %}
                <button type="submit" class="delete-btn" title="Delete Message"
                        onclick="return confirm('Are you sure you want to delete this?');">
                    🗑️
                </button>
            </form>
            {% endif %}
        </div>
        <p class="message-text">{{ chat_msg.message_text }}</p>
    </div>
{% empty %}
    <div style="text-align: center; color: var(--text-secondary); margin-top: 40px; font-size: 1.1rem;">
        <p>No messages yet. Say hi!</p>
    </div>
{% endfor %}
